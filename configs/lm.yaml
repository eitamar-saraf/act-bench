# GPT-mini causal LM on WikiText-2 raw, v1.
# Activation and seed are CLI-only; this file holds shared optimization + model hyperparams.

task: lm

# Optimization
learning_rate: 3.0e-4
batch_size: 32
block_size: 256
max_epochs: 10
warmup_steps: 200
adamw_weight_decay: 0.01

# Model
d_model: 256
nhead: 4
num_layers: 4
dim_feedforward: 1024
dropout: 0.1
tokenizer_name: bert-base-uncased
