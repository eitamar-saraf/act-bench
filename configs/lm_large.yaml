# GPT-mini causal LM on WikiText-103 raw, v1 (full dataset).
# Architecture identical to lm.yaml — only the data and run length change.

task: lm_large

# Optimization
learning_rate: 3.0e-4
batch_size: 32
block_size: 256
max_epochs: 3              # WT-103 is ~52x larger than WT-2; fewer passes still gives plenty of steps.
warmup_steps: 1000
adamw_weight_decay: 0.01

# Model (matches lm.yaml so the data-scale comparison is apples-to-apples)
d_model: 256
nhead: 4
num_layers: 4
dim_feedforward: 1024
dropout: 0.1
tokenizer_name: bert-base-uncased
